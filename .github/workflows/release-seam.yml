name: Release macula-craft-seam to crates.io

on:
  push:
    tags: ["macula-craft-seam-v*"]

jobs:
  publish:
    name: publish macula-craft-seam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag version matches the workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#macula-craft-seam-v}"
          PACKAGE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "macula-craft-seam") | .version')
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION is not the crate version $PACKAGE_VERSION"
            exit 1
          fi
      - run: cargo test -p macula-craft-seam --locked
      - run: cargo clippy -p macula-craft-seam --all-targets --locked -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo publish -p macula-craft-seam --dry-run --locked
      # CRATES_IO_TOKEN: a plain crates.io API token; Trusted Publishing can
      # replace it after the first release exists.
      - name: Publish
        run: cargo publish -p macula-craft-seam --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
