[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/echelon/craft-libs"

[workspace.dependencies]
# internal: add each crate here as `craft-<name> = { path = "crates/<name>" }`
# the collaboration seam, published as macula-craft-seam; code keeps `craft_collab`
craft-collab = { path = "crates/collab", package = "macula-craft-seam", version = "0.4" }
# the share and sign-in windows, published as macula-craft-share; code keeps `craft_share`
craft-share = { path = "crates/share", package = "macula-craft-share", version = "0.4" }

# shared dependencies of the craft libraries
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yrs = "0.23"
egui = { version = "0.36", default-features = false }
qrcode = { version = "0.14", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
