[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# 0.7.0 is the share crate's version; the seam carries its own (0.7.0) in its
# manifest, because the two crates release on their own tags.
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/echelon/craft-libs"

[workspace.dependencies]
# internal: add each crate here as `craft-<name> = { path = "crates/<name>" }`
# the collaboration seam, published as macula-craft-seam; code keeps `craft_collab`
# Pinned to 0.7.0: a share built here is built against invite v5, which is what
# carries the sealed group's prefix and the credential that pulls its key,
# against `CollabSession::sealed()` (0.6.1), which is how the Share window knows
# to grey the open line rather than offer one the seam refuses, and against the
# bounded, recoverable order stall (0.7.0). `0.7.0` is a caret range
# (>=0.7.0, <0.8).
craft-collab = { path = "crates/collab", package = "macula-craft-seam", version = "0.7.0" }
# the share and sign-in windows, published as macula-craft-share; code keeps `craft_share`
craft-share = { path = "crates/share", package = "macula-craft-share", version = "0.7" }

# shared dependencies of the craft libraries
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yrs = "0.23"
# egui 0.37: the line the Craft apps are on (Wordcraft, and upstream craft-libs
# at the rev Wordcraft pins). One binary cannot hold two egui versions, so the
# share windows must be built against the same one the app draws with.
egui = { version = "0.37", default-features = false }
qrcode = { version = "0.14", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
