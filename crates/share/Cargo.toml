[package]
name = "macula-craft-share"
description = "The Share and Sign in windows for Craft apps (egui): invite, approve, revoke and contacts over macula-craft-seam's shared session, realm sign-in with a QR link."
# 0.6.0: on a sealed share the open invite line is greyed with the reason; named invites are the path (macula-craft-collab#26).
# 0.7.0: egui 0.36 -> 0.37, the line the Craft apps draw with, so Wordcraft can embed the windows in one binary (rgfaber/craft-libs#1). No API change; a consumer moves egui with the crate.
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/rgfaber/craft-libs"
readme = "README.md"
keywords = ["collaboration", "egui", "editor", "macula"]
categories = ["gui", "text-editors"]

[lints]
workspace = true

[dependencies]
craft-collab = { workspace = true }
egui = { workspace = true }
qrcode = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rqrr = "0.9"
