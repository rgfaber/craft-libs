[package]
name = "macula-craft-seam"
description = "A collaboration seam for document apps: signed ops, grants and invites, a transport trait, paragraph text merge (yrs) and presence. The Macula mesh transport is macula-craft-collab."
# 0.5.1: inline objects (sync_objects, objects); the share crate stays on the workspace 0.5.0.
# 0.5.2: a realm member's grant is extended while the membership renews; a revoked holder waits for the host.
# 0.5.3: a per-person invite minted after a revoke is the host's yes (Access::revoked_at).
# 0.5.4: the grants store keeps the revocations, so a revoke survives a restart; the store is now {grants, revocations}, and a bare grant array (0.5.3 and earlier) is not read.
# 0.5.5: after the host's clock stepped back, its revoke is signed later than the grant it ends, and a re-grant later than that revoke.
# 0.6.0: invite v5 — the invite carries the share's whole group prefix and the credential that pulls its key, a sealed invite binds the group credential to the person named, and a realm invite or an open invite is refused on a sealed share (macula-craft-collab#26). `is_topic_prefix` holds a group prefix to exactly four segments.
# 0.6.1: `CollabSession::sealed()` — whether the share is sealed is asked of the session that mints invites, from its own ShareContext, not of a flag on the app's host trait, so the windows and the mint cannot disagree.
# 0.7.0: one lost message costs only itself (rgfaber/craft-libs#2). The order buffer reports what it holds and for how long (stats `order: {held, gaps, stalled}`), the session recovers a stall past STALL_DEADLINE_MS by a state exchange and stops asking when nobody answers, the snapshot exchange never queues behind the gap it recovers, and a publication that did not leave the machine is reported as stats `unsent` (macula-craft-collab#39).
version = "0.7.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/rgfaber/craft-libs"
readme = "README.md"
keywords = ["collaboration", "crdt", "editor", "macula"]
categories = ["text-editors", "network-programming"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
yrs = { workspace = true }

[dev-dependencies]
# The released 0.4 seam, for the test that 0.4 and this version agree on the
# unnamed body (WordCraft's and GridCraft's shared documents).
seam04 = { package = "macula-craft-seam", version = "=0.4.0" }
