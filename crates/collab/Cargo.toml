[package]
name = "macula-craft-seam"
description = "A collaboration seam for document apps: signed ops, grants and invites, a transport trait, paragraph text merge (yrs) and presence. The Macula mesh transport is macula-craft-collab."
# 0.5.1: inline objects (sync_objects, objects); the share crate stays on the workspace 0.5.0.
version = "0.5.1"
edition.workspace = true
license.workspace = true
repository = "https://github.com/rgfaber/craft-libs"
readme = "README.md"
keywords = ["collaboration", "crdt", "editor", "macula"]
categories = ["text-editors", "network-programming"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
yrs = { workspace = true }

[dev-dependencies]
# The released 0.4 seam, for the test that 0.4 and this version agree on the
# unnamed body (WordCraft's and GridCraft's shared documents).
seam04 = { package = "macula-craft-seam", version = "=0.4.0" }
