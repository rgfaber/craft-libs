[package]
name = "craft-qr"
description = "The shared QR helper for the Craft apps: a link or any text to a module matrix, and the matrix to text for agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# A real decoder, so the tests prove the symbol reads back, not just its shape
rqrr = "0.9"
